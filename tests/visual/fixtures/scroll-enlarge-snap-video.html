<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture: scroll-enlarge-snap-video</title>
    <style>
      body { margin: 0; background: #f4efdf; color: #262118; font-family: system-ui, sans-serif; }
      .spacer { height: 60vh; display: grid; place-items: center; letter-spacing: 0.2em; text-transform: uppercase; }
      .venue_intro { padding: 6rem 2rem 2rem; text-align: center; }
      .venue_intro h2 { margin: 0 0 1.5rem; font: italic 3.5rem/1.1 Georgia, serif; }
      .venue_stage { box-sizing: border-box; height: 100svh; padding: 1.25rem; display: flex; align-items: center; justify-content: center; }
      .venue_media {
        position: relative; width: 79%; aspect-ratio: 16 / 9; overflow: hidden; background: #000;
        clip-path: polygon(24px 0, calc(100% - 24px) 0, 100% 24px, 100% calc(100% - 24px), calc(100% - 24px) 100%, 24px 100%, 0 calc(100% - 24px), 0 24px);
      }
      .venue_item { position: absolute; inset: 0; }
      .venue_item img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .venue_content {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 1rem; color: #f4efdf; background: rgb(0 0 0 / 0.35); text-align: center;
      }
      .venue_content h3 { margin: 0; font: 4rem/1 Georgia, serif; }
      .venue_content p { margin: 0; }
      .venue_content a { background: #f4efdf; color: #262118; padding: 0.5rem 1.25rem; text-decoration: none; font-size: 0.75rem; letter-spacing: 0.15em; }
      .venue_tabs { position: absolute; left: 50%; bottom: 2rem; transform: translateX(-50%); z-index: 50; display: flex; gap: 2rem; padding: 1rem 2rem; background: #4a1218; }
      .venue_tab { color: rgb(244 239 223 / 0.6); text-decoration: none; font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; }
      .venue_tab.is-active { color: #f4efdf; text-decoration: underline; }
      .venue_stage.is-bleed { padding: 0; }
      .venue_media.is-bleed { width: 78%; aspect-ratio: 1253 / 753; clip-path: none; }
      .venue_content.is-bleed { justify-content: flex-end; align-items: flex-start; text-align: left; background: transparent; padding: 2.5rem; box-sizing: border-box; }
      .venue_eyebrow p { max-width: 40rem; font-size: 0.875rem; letter-spacing: 0.15em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div class="spacer">Scroll</div>

    <!-- #428: panel 2 has a video link on its image frame, panel 3 a blank one, panel 4 a broken one -->
    <section class="section_venue" data-scroll-enlarge-snap id="venues">
      <div class="venue_stage" data-scroll-enlarge-snap-stage>
        <div class="venue_media" data-scroll-enlarge-snap-media>
          <article class="venue_item" data-scroll-enlarge-snap-item>
            <figure style="margin:0;height:100%"><img data-scroll-enlarge-snap-image data-fixture-image="wellness-in-room" alt="" /></figure>
            <div class="venue_content" data-scroll-enlarge-snap-content><h3>Image panel</h3><p>No video link.</p></div>
          </article>
          <article class="venue_item" data-scroll-enlarge-snap-item>
            <figure style="margin:0;height:100%" data-video-link="{VIDEO}"><img data-scroll-enlarge-snap-image data-fixture-image="wellness-fitness" alt="" /></figure>
            <div class="venue_content" data-scroll-enlarge-snap-content><h3>Video panel</h3><p>Plays a video over its image.</p></div>
          </article>
          <article class="venue_item" data-scroll-enlarge-snap-item>
            <figure style="margin:0;height:100%" data-video-link="   "><img data-scroll-enlarge-snap-image data-fixture-image="wellness-dining" alt="" /></figure>
            <div class="venue_content" data-scroll-enlarge-snap-content><h3>Blank link</h3><p>Shows its image.</p></div>
          </article>
          <article class="venue_item" data-scroll-enlarge-snap-item>
            <figure style="margin:0;height:100%" data-video-link="not a link"><img data-scroll-enlarge-snap-image data-fixture-image="wellness-events" alt="" /></figure>
            <div class="venue_content" data-scroll-enlarge-snap-content><h3>Broken link</h3><p>Shows its image.</p></div>
          </article>
        </div>
      </div>
    </section>

    <div class="spacer">End</div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js"></script>
    <script src="./scroll-enlarge-snap-video.js"></script>
  </body>
</html>
