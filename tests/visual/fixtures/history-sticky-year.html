<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture: history sticky year and collapse gallery</title>
<!--
  Local preview for src/utils/historyStickyYear.ts. Served by
  tests/visual/history-sticky-year.spec.ts, which bundles
  history-sticky-year.entry.ts and maps /figma/* to the repo snapshot.
  Watch it with: pnpm exec playwright test history-sticky-year --headed
  Placeholder images are the history section crops from figma/pages/history.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4efdf; color: #262118; }
  img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .intro { height: 100vh; display: grid; place-items: center; }
  .timeline { position: relative; padding: 0 2rem; }
  .timeline_label-wrap { position: sticky; top: 50vh; z-index: 2; display: flex; justify-content: center; height: 0; }
  .timeline_label { transform: translateY(-50%); background: #29310c; color: #f4efdf; padding: 0.5rem 1.5rem; font-size: 2.5rem; letter-spacing: 0.05em; overflow: hidden; }
  .timeline_label-text { display: block; }
  .timeline_item { min-height: 150vh; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: center; padding: 20vh 0; }
  .timeline_item figure { margin: 0; aspect-ratio: 4 / 3; }
  .gallery { background: #000; color: #f4efdf; height: 100vh; overflow: clip; display: flex; flex-direction: column; justify-content: center; gap: 2rem; padding: 0 2rem; text-align: center; }
  .gallery_list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2rem; }
  .gallery_item { margin: 0; aspect-ratio: 356 / 466; }
  .outro { height: 150vh; }
</style>
</head>
<body>
  <section class="intro"><h1>A bold promise</h1></section>

  <section class="timeline" data-history-sticky-year>
    <div class="timeline_label-wrap">
      <div class="timeline_label" data-history-sticky-year-label>
        <span class="timeline_label-text" data-history-sticky-year-text>1924</span>
      </div>
    </div>
    <article class="timeline_item" data-history-sticky-year-item="1924">
      <header><h4>A YMCA landmark is born</h4></header>
      <figure><img src="/figma/pages/history/sections/04-george-marston/section.webp" alt=""></figure>
    </article>
    <article class="timeline_item" data-history-sticky-year-item="1924-1970">
      <header><h4>The Army and Navy YMCA</h4></header>
      <figure><img src="/figma/pages/history/sections/03-san-diegos-great-escape-oasis-is/section.webp" alt=""></figure>
    </article>
    <article class="timeline_item" data-history-sticky-year-item="2019">
      <header><h4>The Guild opens its doors</h4></header>
      <figure><img src="/figma/pages/history/sections/02-a-century-of-stories-meets-a/section.webp" alt=""></figure>
    </article>
    <article class="timeline_item" data-history-sticky-year-item="2026">
      <header><h4>The Guild builds the future</h4></header>
      <figure><img src="/figma/pages/history/sections/01-a-bold-promise/section.webp" alt=""></figure>
    </article>
  </section>

  <section class="gallery" data-history-collapse>
    <header data-history-collapse-fade><h2>A Landmark Reimagined</h2></header>
    <div class="gallery_list">
      <figure class="gallery_item" data-history-collapse-item><img src="/figma/pages/history/sections/04-george-marston/section.webp" alt=""></figure>
      <figure class="gallery_item" data-history-collapse-item><img src="/figma/pages/history/sections/03-san-diegos-great-escape-oasis-is/section.webp" alt=""></figure>
      <figure class="gallery_item" data-history-collapse-item><img src="/figma/pages/history/sections/02-a-century-of-stories-meets-a/section.webp" alt=""></figure>
      <figure class="gallery_item" data-history-collapse-item><img src="/figma/pages/history/sections/06-a-landmark-reimagined/section.webp" alt=""></figure>
    </div>
    <p data-history-collapse-fade>Discover the materials, colors and details that INC architecture chose to reveal the character of The Guild.</p>
  </section>

  <section class="outro"></section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="/history-sticky-year.js"></script>
</body>
</html>
