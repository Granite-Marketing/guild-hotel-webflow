<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture: hero image scale</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #f4efdf; }
      .section_hero-fullbleed-centered { position: relative; height: 600px; margin: 40px; }
      .hero-fullbleed-centered_figure { position: absolute; inset: 0; margin: 0; }
      .hero-fullbleed-centered_image { display: block; width: 100%; height: 100%; object-fit: cover; background: #888; }
    </style>
  </head>
  <body>
    <section class="section_hero-fullbleed-centered">
      <figure class="hero-fullbleed-centered_figure">
        <img class="hero-fullbleed-centered_image" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" />
      </figure>
    </section>
    <script src="./hero-image-scale.js"></script>
  </body>
</html>
