<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

      .accordion_content { padding: 1rem; height: 220px; background: #eee; }
      .section_footer-links { height: 70vh; background: #29310c; color: #f4efdf; }
      .footer_scale { height: 200px; background: #556b2f; transform-origin: 50% 100%; }
      .cta_reveal { height: 160px; background: #c9b27c; }
    </style>
  </head>
  <body>
    <div class="fixture_top">Top</div>
    <section class="faq">
      <div class="accordion_header">Question one</div>
      <div class="accordion_wrapper"><div class="accordion_content">Answer one</div></div>
      <div class="accordion_header">Question two</div>
      <div class="accordion_wrapper"><div class="accordion_content">Answer two</div></div>
      <div class="accordion_header">Question three</div>
      <div class="accordion_wrapper"><div class="accordion_content">Answer three</div></div>

    <div class="cta_reveal" data-test="cta">CTA</div>
    <section class="section_footer-links"><div class="footer_scale">Footer</div></section>
