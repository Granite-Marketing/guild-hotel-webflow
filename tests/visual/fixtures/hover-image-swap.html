<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture: hover image swap</title>
    <!-- Published Webflow CSS for /rooms (staging publish 2026-10-26). -->
    <link href="https://cdn.prod.website-files.com/6ad6405eae8eac6d7b7c41a3/css/the-guild-hotel-c34e71.webflow.shared.6d399b151.css" rel="stylesheet" type="text/css" />
    <!-- Stand-in for the Designer combo .rooms-collection-quiz_image.is-swap (F25), not yet published. -->
    <style>
      .rooms-collection-quiz_image.is-swap { opacity: 0; visibility: hidden; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  </head>
  <body>
    <!-- Quiz step 1 markup from staging /rooms, plus the F25 Designer contract (attributes and four is-swap images). -->
    <section id="rooms-quiz" data-quiz-step="1" data-hover-swap="true" class="section_rooms-collection-quiz is-first"><div class="rooms-collection-quiz_component"><div class="rooms-collection-quiz_content"><header class="rooms-collection-quiz_header"><p aria-label="Step 1 of 3" class="rooms-collection-quiz_counter text-style-caption">01 / 03</p><h2 class="heading-style-h4">who’s checking in?</h2></header><div role="list" data-hover-swap-list="true" class="rooms-collection-quiz_options"><div role="listitem" class="rooms-collection-quiz_option"><a data-quiz-option="just me" data-hover-swap-trigger="just-me" href="#" class="button is-chamfer is-outline-light w-button">just me</a></div><div role="listitem" class="rooms-collection-quiz_option"><a aria-pressed="true" data-quiz-option="two guests" data-hover-swap-trigger="two-guests" href="#" class="button is-chamfer is-text-burgundy w-button">two guests</a></div><div role="listitem" class="rooms-collection-quiz_option"><a data-quiz-option="3-4 guests" data-hover-swap-trigger="3-4-guests" href="#" class="button is-chamfer is-outline-light w-button">3-4 guests</a></div><div role="listitem" class="rooms-collection-quiz_option"><a data-quiz-option="5+ guests" data-hover-swap-trigger="5-plus-guests" href="#" class="button is-chamfer is-outline-light w-button">5+ guests</a></div></div><footer class="rooms-collection-quiz_footer"><a aria-expanded="false" data-modal-open="all-rooms" aria-haspopup="dialog" href="#" class="rooms-collection-quiz_link text-style-caps-caption-16">see all the rooms</a></footer></div><figure class="rooms-collection-quiz_figure"><img src="https://cdn.prod.website-files.com/6ad6405eae8eac6d7b7c41a3/6ad66fed15beaf9a7285e5c8_22db683e135ddee3633012bf9bf473d63a8f49e2.avif" loading="lazy" alt="The Guild Hotel entrance, a carved stone arch under the Young Men&#x27;s Christian Association frieze" data-hover-swap-media="default" class="rooms-collection-quiz_image"/><img src="https://cdn.prod.website-files.com/6ad6405eae8eac6d7b7c41a3/6ad66feb58367429abb4835f_0c5cb498b7eacbe1174374b129d91e21a3a9ddcd.avif" loading="lazy" alt="Guest relaxing in bed in a robe with a tan channel headboard and breakfast tray" data-hover-swap-media="just-me" class="rooms-collection-quiz_image is-swap"/><img src="https://cdn.prod.website-files.com/6ad6405eae8eac6d7b7c41a3/6ad67004134731ad1b927d6c_8303f7c977cff864b2b171528b08d4a7957b69c6.avif" loading="lazy" alt="Guest room with a tan upholstered headboard, white bedding and an arched window" data-hover-swap-media="two-guests" class="rooms-collection-quiz_image is-swap"/><img src="https://cdn.prod.website-files.com/6ad6405eae8eac6d7b7c41a3/6ad66ff0f8bf4846e809ead6_27f6840ca839b9675c82ed8eb521abfc5f478c78.avif" loading="lazy" alt="Light guest room with two beds, a tan lounge chair and tall factory windows" data-hover-swap-media="3-4-guests" class="rooms-collection-quiz_image is-swap"/><img src="https://cdn.prod.website-files.com/6ad6405eae8eac6d7b7c41a3/6ad67001f08ff78c37d85427_745c085a4a4187ad24dd49e947e40a436a1ffbdd.avif" loading="lazy" alt="Loft suite living area with a wooden dining table, green sofa and tall windows" data-hover-swap-media="5-plus-guests" class="rooms-collection-quiz_image is-swap"/></figure></div></section>
    <script src="./hover-image-swap.js"></script>
  </body>
</html>
