<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture: imageTrailHover (home section 14)</title>
    <style>
      body { margin: 0; background: #f4efdf; color: #29310c; font-family: sans-serif; }
      .section_heading-wide-image-cta { padding: 7rem 2rem; }
      .heading-wide-image-cta_header { text-align: center; margin-bottom: 3rem; }
      .heading-wide-image-cta_media {
        position: relative;
        overflow: hidden;
        height: 50rem;
        max-width: 95rem;
        margin: 0 auto;
        border-radius: 2rem;
        background: linear-gradient(160deg, #6b5a44, #2f3326);
      }
      .heading-wide-image-cta_trail-item { display: block; width: 20.5rem; }
      .heading-wide-image-cta_trail-item figure { margin: 0; }
      .heading-wide-image-cta_trail-item img {
        display: block;
        width: 100%;
        aspect-ratio: 328 / 467;
        object-fit: cover;
        border-radius: 1rem;
      }
    </style>
  </head>
  <body>
    <section class="section_heading-wide-image-cta">
      <header class="heading-wide-image-cta_header">
        <h2>art &amp; stories</h2>
        <p>we've lived here for a century; let us show you around.</p>
        <footer><a href="/arts">Discover more</a></footer>
      </header>
      <div class="heading-wide-image-cta_media" data-image-trail-hover data-testid="trail-zone">
        <a class="heading-wide-image-cta_trail-item" data-image-trail-hover-item href="/arts#art-1">
          <figure><img src="image-trail-hover/trail-1.webp" alt="Bronze reclining figure on a plinth" /></figure>
        </a>
        <a class="heading-wide-image-cta_trail-item" data-image-trail-hover-item href="/arts#art-2">
          <figure><img src="image-trail-hover/trail-2.webp" alt="Placeholder art item 2" /></figure>
        </a>
        <a class="heading-wide-image-cta_trail-item" data-image-trail-hover-item href="/arts#art-3">
          <figure><img src="image-trail-hover/trail-3.webp" alt="Placeholder art item 3" /></figure>
        </a>
        <a class="heading-wide-image-cta_trail-item" data-image-trail-hover-item href="/arts#art-4">
          <figure><img src="image-trail-hover/trail-4.webp" alt="Placeholder art item 4" /></figure>
        </a>
        <a class="heading-wide-image-cta_trail-item" data-image-trail-hover-item href="/arts#art-5">
          <figure><img src="image-trail-hover/trail-5.webp" alt="Placeholder art item 5" /></figure>
        </a>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="image-trail-hover.js"></script>
  </body>
</html>
