    <title>Fixture: focus rings, script tilt space, directions links (#235)</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      /* Webflow base style: a ring on plain :focus, the case the module must quiet. */
      a:focus, button:focus, [tabindex]:focus { outline: 3px solid rgb(255, 0, 0); outline-offset: 2px; }
      .tilted { rotate: -7.38deg; font-size: 40px; margin: 0; }
      .level { font-size: 40px; margin: 0; }
      @media (min-width: 768px) { .level { rotate: -7.38deg; } }
      @media (max-width: 767px) { .level { rotate: none; } }
    </style>
  </head>
