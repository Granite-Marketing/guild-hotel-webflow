<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture: gallery filter (A05)</title>
    <!--
      Local preview for src/utils/galleryFilter.ts and the Arts detail modal
      (src/utils/modals.ts). Served by `pnpm dev` at
      http://localhost:3000/fixtures/gallery-filter.html and loaded by
      tests/visual/gallery-filter.spec.ts. Placeholder images are Figma
      section crops, set by gallery-filter.ts.
    -->
    <style>
      :root {
        --cream: #f4efdf;
        --burgundy: #4a1217;
        --dark: #262118;
        --placeholder: #d9d9d9;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--cream); font-family: system-ui, sans-serif; }
      .hide { display: none !important; }
      .spacer { height: 60vh; display: grid; place-items: center; color: var(--dark); }

      /* Gallery page, section 02 (gallery-mosaic-captioned is-compact) */
      .gallery_grid { display: flex; flex-wrap: wrap; gap: 1.5rem; padding: 0.75rem 0; }
      .gallery_item { margin: 0; height: 25.875rem; background: var(--placeholder); overflow: hidden; flex: 1 1 14rem; }
      .gallery_item.is-wide { flex-basis: 30rem; }
      .gallery_item img, .arts_item img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .gallery_tags {
        position: sticky; bottom: 2rem; z-index: 2;
        display: flex; gap: 1.5rem; width: max-content; margin: -5.5rem auto 2rem;
        padding: 1.125rem 2.25rem; background: var(--burgundy);
        clip-path: polygon(1.25rem 0, calc(100% - 1.25rem) 0, 100% 35%, 100% 65%, calc(100% - 1.25rem) 100%, 1.25rem 100%, 0 65%, 0 35%);
      }
      .gallery_tag {
        background: none; border: 0; padding: 0; cursor: pointer;
        font: 400 1rem/1.2 system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase;
        color: rgba(244, 239, 223, 0.5);
      }
      .gallery_tag.is-active { color: var(--cream); }
      .gallery_empty { display: none; padding: 4rem; text-align: center; }
      .gallery_empty.is-active { display: block; }

      /* Arts page, section 06 (gallery-mosaic-captioned is-dark is-compact) */
      .section_arts { background: var(--dark); padding: 1.5rem 0; }
      .arts_grid { display: flex; flex-wrap: wrap; gap: 1.5rem; }
      .arts_item { flex: 1 1 14rem; height: 25.875rem; padding: 0; border: 0; background: var(--placeholder); cursor: pointer; overflow: hidden; }
      .arts_item.is-wide { flex-basis: 30rem; }

      /* Detail modal (overlay-detail-panel-modal is-dark is-media-left) */
      .arts_modal {
        position: fixed; inset: 0; z-index: 10; display: grid; grid-template-columns: 1fr 1fr; gap: 6rem;
        padding: 2.5rem 3.5rem; background: var(--dark); color: var(--cream);
        opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0.4s;
      }
      .arts_modal.is-open { opacity: 1; visibility: visible; }
      .arts_modal figure { margin: 0; }
      .arts_modal img { width: 100%; height: 100%; object-fit: cover; }
      .arts_modal-content { display: flex; flex-direction: column; justify-content: space-between; }
      .arts_modal-close { align-self: flex-start; background: none; border: 0; color: inherit; cursor: pointer; text-transform: uppercase; letter-spacing: 0.08em; }
      .arts_modal h2 { font-weight: 400; text-transform: uppercase; letter-spacing: 0.08em; }
      @media (prefers-reduced-motion: reduce) { .arts_modal { transition: none; } }
    </style>
  </head>
  <body>
    <div class="spacer">Scroll to the gallery</div>

    <section class="section_gallery" data-gallery-filter>
      <div class="gallery_grid">
        <figure class="gallery_item" data-gallery-filter-item="Design"><img data-placeholder="0" alt="" /></figure>
        <figure class="gallery_item" data-gallery-filter-item="Wellness"><img data-placeholder="1" alt="" /></figure>
        <figure class="gallery_item is-wide" data-gallery-filter-item="Dining, Amenities"><img data-placeholder="2" alt="" /></figure>
        <figure class="gallery_item" data-gallery-filter-item="Rooms"><img data-placeholder="3" alt="" /></figure>
        <figure class="gallery_item" data-gallery-filter-item="Amenities"><img data-placeholder="4" alt="" /></figure>
        <figure class="gallery_item" data-gallery-filter-item="Guests"><img data-placeholder="5" alt="" /></figure>
        <figure class="gallery_item is-wide" data-gallery-filter-item="Design"><img data-placeholder="6" alt="" /></figure>
        <figure class="gallery_item is-wide" data-gallery-filter-item="Dining"><img data-placeholder="0" alt="" /></figure>
        <figure class="gallery_item" data-gallery-filter-item="Rooms"><img data-placeholder="1" alt="" /></figure>
        <figure class="gallery_item" data-gallery-filter-item="Wellness"><img data-placeholder="2" alt="" /></figure>
        <figure class="gallery_item" data-gallery-filter-item="Dining"><img data-placeholder="3" alt="" /></figure>
        <figure class="gallery_item" data-gallery-filter-item="Design, Rooms"><img data-placeholder="4" alt="" /></figure>
      </div>
      <p class="gallery_empty" data-gallery-filter-empty>Nothing in this category yet.</p>
      <nav class="gallery_tags" aria-label="Filter gallery">
        <button type="button" class="gallery_tag is-active" data-gallery-filter-tag="all">All</button>
        <button type="button" class="gallery_tag" data-gallery-filter-tag="design">Design</button>
        <button type="button" class="gallery_tag" data-gallery-filter-tag="wellness">Wellness</button>
        <button type="button" class="gallery_tag" data-gallery-filter-tag="dining">Dining</button>
        <button type="button" class="gallery_tag" data-gallery-filter-tag="rooms">Rooms</button>
        <button type="button" class="gallery_tag" data-gallery-filter-tag="amenities">Amenities</button>
        <button type="button" class="gallery_tag" data-gallery-filter-tag="guests">Guests</button>
        <button type="button" class="gallery_tag" data-gallery-filter-tag="events">Events</button>
      </nav>
    </section>

    <section class="section_arts">
      <div class="arts_grid">
        <button type="button" class="arts_item" data-modal-open="oceano" aria-label="Oceano, by Eva Struble"><img data-placeholder="5" alt="" /></button>
        <button type="button" class="arts_item is-wide" data-modal-open="oceano-study" aria-label="Oceano study"><img data-placeholder="6" alt="" /></button>
        <button type="button" class="arts_item" data-modal-open="oceano" aria-label="Oceano, by Eva Struble"><img data-placeholder="0" alt="" /></button>
      </div>
    </section>

    <div class="spacer">End of fixture</div>

    <div class="arts_modal" role="dialog" id="oceano" aria-modal="true" aria-hidden="true">
      <figure><img data-placeholder="5" alt="" /></figure>
      <div class="arts_modal-content">
        <button type="button" class="arts_modal-close" data-modal-close>Back</button>
        <div>
          <h2>&lsquo;Oceano&rsquo;</h2>
          <p>By Eva Struble. 2024, 48 x 60 in, oil and acrylic on canvas.</p>
          <p>Eva&rsquo;s work unfolds through layered color, texture, and abstraction.</p>
        </div>
      </div>
    </div>
    <div class="arts_modal" role="dialog" id="oceano-study" aria-modal="true" aria-hidden="true">
      <figure><img data-placeholder="6" alt="" /></figure>
      <div class="arts_modal-content">
        <button type="button" class="arts_modal-close" data-modal-close>Back</button>
        <div>
          <h2>Oceano study</h2>
          <p>Placeholder second piece for the multi-dialog case.</p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="./gallery-filter.js"></script>
  </body>
</html>
