<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture: gallery canvas</title>
    <!--
      Local preview for src/utils/galleryCanvas.ts with galleryFilter and the
      Arts detail modal. Served by `pnpm dev` at
      http://localhost:3000/fixtures/gallery-canvas.html and loaded by
      tests/visual/gallery-canvas.spec.ts. Class names match the live
      /gallery and /arts sections; the canvas layout comes from
      docs/reference/site-head/gallery-canvas.css (linked as gallery-canvas.css).
      Photos are generated placeholders with mixed aspect ratios.
    -->
    <link rel="stylesheet" href="./gallery-canvas.css" />
    <style>
      :root { --cream: #f4efdf; --burgundy: #4a1217; --dark: #262118; --placeholder: #d9d9d9; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--cream); font-family: system-ui, sans-serif; }
      .hide { display: none !important; }
      .spacer { height: 60vh; display: grid; place-items: center; color: var(--dark); }

      /* Webflow Designer styles the canvas CSS overrides (today's grid). */
      .section_gallery-all { padding: 1.5rem 0; }
      .section_gallery-all.is-dark { background: var(--dark); }
      .gallery-all_grid { display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: center; }
      .gallery-all_item { margin: 0; width: 14rem; height: 25.875rem; background: var(--placeholder); overflow: hidden; }
      .gallery-all_link { display: block; width: 100%; height: 100%; }
      .gallery-all_tags-wrapper { position: sticky; bottom: 2rem; margin-top: -5.5rem; }

      /* Shared chamfered pill (tab-pills-intro). */
      .tab-pills-intro_tabs {
        display: flex; gap: 1.5rem; width: max-content; margin: 0 auto;
        padding: 1.125rem 2.25rem; background: var(--burgundy);
        clip-path: polygon(1.25rem 0, calc(100% - 1.25rem) 0, 100% 35%, 100% 65%, calc(100% - 1.25rem) 100%, 1.25rem 100%, 0 65%, 0 35%);
      }
      .tab-pills-intro_tab {
        font: 400 0.875rem/1.2 system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase;
        color: rgba(244, 239, 223, 0.5); text-decoration: none; white-space: nowrap;
      }
      .tab-pills-intro_tab.is-active { color: var(--cream); }
      .gallery-all_empty { display: none; position: absolute; inset: 40% 0 auto; text-align: center; }
      .gallery-all_empty.is-active { display: block; }

      /* Detail modal (overlay-detail-panel-modal is-dark). */
      .arts_modal {
        position: fixed; inset: 0; z-index: 10; display: grid; grid-template-columns: 1fr 1fr; gap: 6rem;
        padding: 2.5rem 3.5rem; background: var(--dark); color: var(--cream);
        opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0.4s;
      }
      .arts_modal.is-open { opacity: 1; visibility: visible; }
      .arts_modal img { width: 100%; height: 100%; object-fit: cover; }
      .arts_modal-close { align-self: flex-start; background: none; border: 0; color: inherit; cursor: pointer; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div class="spacer">Scroll to the gallery</div>

    <!-- /gallery: static grid -->
    <section id="gallery" class="section_gallery-all" data-gallery-filter data-gallery-canvas data-eager>
      <div class="gallery-all_scroller">
        <div class="gallery-all_grid" data-photos="gallery"></div>
      </div>
      <p class="gallery-all_empty" data-gallery-filter-empty>Nothing in this category yet.</p>
      <div class="gallery-all_tags-wrapper">
        <nav class="tab-pills-intro_tabs is-scroll" aria-label="Filter gallery">
          <a href="#" class="tab-pills-intro_tab is-active" data-gallery-filter-tag="all">All</a>
          <a href="#" class="tab-pills-intro_tab" data-gallery-filter-tag="design">Design</a>
          <a href="#" class="tab-pills-intro_tab" data-gallery-filter-tag="wellness">Wellness</a>
          <a href="#" class="tab-pills-intro_tab" data-gallery-filter-tag="dining">Dining</a>
          <a href="#" class="tab-pills-intro_tab" data-gallery-filter-tag="rooms">Rooms</a>
          <a href="#" class="tab-pills-intro_tab" data-gallery-filter-tag="guests">Guests</a>
        </nav>
      </div>
      <div class="gallery-all_controls">
        <div class="tab-pills-intro_tabs is-canvas-controls">
          <div class="gallery-all_joystick"><div class="gallery-all_joystick-knob"></div></div>
          <div class="gallery-all_zoom">
            <a href="#" class="tab-pills-intro_tab" data-gallery-canvas-zoom="out">Zoom out</a>
            <a href="#" class="tab-pills-intro_tab is-active" data-gallery-canvas-zoom="reset">Normal</a>
            <a href="#" class="tab-pills-intro_tab" data-gallery-canvas-zoom="in">Zoom in</a>
          </div>
        </div>
      </div>
    </section>

    <div class="spacer">Between the galleries</div>

    <!-- /arts: CMS shape (Collection List Wrapper is the window) -->
    <section id="arts" class="section_gallery-all is-dark" data-gallery-filter data-gallery-canvas data-eager>
      <div class="gallery-all_scroller w-dyn-list">
        <div role="list" class="gallery-all_grid w-dyn-items" data-photos="arts"></div>
      </div>
      <div class="gallery-all_tags-wrapper">
        <nav class="tab-pills-intro_tabs is-scroll" aria-label="Filter art">
          <a href="#" class="tab-pills-intro_tab is-active" data-gallery-filter-tag="all">All</a>
          <a href="#" class="tab-pills-intro_tab" data-gallery-filter-tag="painting">Painting</a>
          <a href="#" class="tab-pills-intro_tab" data-gallery-filter-tag="photography">Photography</a>
          <a href="#" class="tab-pills-intro_tab" data-gallery-filter-tag="sculpture">Sculpture</a>
        </nav>
      </div>
      <div class="gallery-all_controls">
        <div class="tab-pills-intro_tabs is-canvas-controls">
          <div class="gallery-all_joystick"><div class="gallery-all_joystick-knob"></div></div>
          <div class="gallery-all_zoom">
            <a href="#" class="tab-pills-intro_tab" data-gallery-canvas-zoom="out">Zoom out</a>
            <a href="#" class="tab-pills-intro_tab is-active" data-gallery-canvas-zoom="reset">Normal</a>
            <a href="#" class="tab-pills-intro_tab" data-gallery-canvas-zoom="in">Zoom in</a>
          </div>
        </div>
      </div>
    </section>

    <div class="spacer">End of fixture</div>

    <div class="arts_modal" role="dialog" id="art-1" aria-modal="true" aria-hidden="true">
      <figure><img alt="" /></figure>
      <div>
        <button type="button" class="arts_modal-close" data-modal-close>Back</button>
        <h2>Art piece 1</h2>
        <p>Placeholder description.</p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/Draggable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/InertiaPlugin.min.js"></script>
    <script src="./gallery-canvas.js"></script>
  </body>
</html>
