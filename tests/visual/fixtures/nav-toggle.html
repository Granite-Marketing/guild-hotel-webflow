<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture: nav toggle</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js"></script>
    <style>
      body { margin: 0; background: #f4efdf; color: #262118; font-family: sans-serif; }
      .site-nav_component { position: fixed; inset: 0 0 auto 0; z-index: 10; }
      .site-nav_bar { display: flex; justify-content: space-between; padding: 1rem 2rem; }
      .site-nav_toggle { display: inline-block; padding: 0.5rem 1rem; border: 1px solid currentColor; color: inherit; }
      .site-nav_menu { position: fixed; inset: 0; background: #29310c; color: #f4efdf; opacity: 0; visibility: hidden; pointer-events: none; }
      .site-nav_menu-list { display: flex; flex-direction: column; gap: 0.5rem; padding: 6rem 2rem 2rem; }
      .site-nav_menu-link { color: inherit; font-size: 1.5rem; }
      .fixture_spacer { height: 300vh; padding-top: 6rem; }
    </style>
    <style>
      .site-nav_menu{transition:opacity .4s ease,visibility .4s ease}
      .site-nav_component.is-nav-open{color:#f4efdf}
      .site-nav_component.is-nav-open .site-nav_menu{opacity:1;visibility:visible;pointer-events:auto}
    </style>
  </head>
  <body>
    <header class="site-nav_component" data-nav="header" data-nav-lock="always">
      <div class="site-nav_bar">
        <a class="site-nav_toggle" data-nav="open" href="#" aria-label="Open navigation menu">Menu</a>
        <a class="site-nav_book" href="#book">book now</a>
      </div>
      <div class="site-nav_menu" data-nav="menu">
        <nav class="site-nav_menu-nav" aria-label="Main">
        <div class="site-nav_menu-list" data-nav="list">
          <a class="site-nav_menu-link" data-nav="link" href="#stay">stay</a>
          <a class="site-nav_menu-link" data-nav="link" href="#dine">dine</a>
          <a class="site-nav_menu-link" data-nav="link" href="#wellness">wellness</a>
          <a class="site-nav_menu-link" data-nav="link" href="#events">events</a>
          <a class="site-nav_menu-link" data-nav="link" href="#offers">offers</a>
          <a class="site-nav_menu-link" data-nav="link" href="#gallery">gallery</a>
          <a class="site-nav_menu-link" data-nav="link" href="#history">history</a>
          <a class="site-nav_menu-link" data-nav="link" href="#journal">journal</a>
          <a class="site-nav_menu-link" data-nav="link" href="#contact">contact</a>
        </div>
        </nav>
      </div>
    </header>
    <main class="fixture_spacer">Scroll down</main>
    <script src="/tests/visual/fixtures/nav-toggle.js"></script>
  </body>
</html>
