<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scroll reveal fade-only fixture (ticket #233)</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      .spacer { height: 120vh; }
      .accordion_item { border-bottom: 1px solid #888; padding: 1rem 0; }
      .form-split-script-contact_field { padding: 1rem 0; }
      .home-art-stories_trail-figure { margin: 0; height: 12rem; background: #aaa; }
    </style>
  </head>
  <body>
    <div class="spacer"></div>
    <main>
      <section>
        <div class="faq-accordion_list"><div class="accordion_item"><button class="accordion_header"><div class="accordion_question">Question number 0?</div></button></div><div class="accordion_item"><button class="accordion_header"><div class="accordion_question">Question number 1?</div></button></div><div class="accordion_item"><button class="accordion_header"><div class="accordion_question">Question number 2?</div></button></div></div>
        <div class="spacer"></div>
        <div class="form-split-script-contact_fieldsets"><div class="form-split-script-contact_fieldset"><form><div class="form-split-script-contact_fields"><div class="form-split-script-contact_field"><input class="form-split-script-contact_input" placeholder="Field 0" /></div><div class="form-split-script-contact_field"><input class="form-split-script-contact_input" placeholder="Field 1" /></div><div class="form-split-script-contact_field"><input class="form-split-script-contact_input" placeholder="Field 2" /></div></div></form></div></div>
        <div class="spacer"></div>
        <div class="home-art-stories_trail-item"><figure class="home-art-stories_trail-figure" data-test="collage"></figure></div>
        <div class="spacer"></div>
        <div data-reveal="fade-only" data-test="designer"><p>Designer fade-only block</p></div>
        <div class="spacer"></div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script src="./scroll-reveal-fade-only.js"></script>
  </body>
</html>
