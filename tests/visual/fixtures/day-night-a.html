<!doctype html>
<html lang="en" class="w-mod-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture: day and night content switch (a, ticket #339)</title>
    <!--HEAD-->
    <style>
      body { margin: 0; font-family: sans-serif; }
      .modes { position: fixed; top: 0; right: 0; z-index: 5; display: flex; gap: 8px; }
      main { padding: 60px 16px 40px; max-width: 700px; }
      img { display: block; width: 100%; max-width: 400px; height: 200px; }
      [data-video-frame] { position: relative; height: 120px; background: #ccc; }
      h1, h2 { overflow-wrap: anywhere; }
      .button { display: inline-block; padding: 8px 16px; background: #ddd; }
    </style>
  </head>
  <body>
    <nav class="modes">
      <button type="button" data-day-night="day">Day</button>
      <button type="button" data-day-night="night">Night</button>
    </nav>
    <main>
      <h1 id="hero" data-hero-title data-night-text="Night hero heading that is long enough to wrap onto several lines on a phone">Day hero heading that is long enough to wrap onto several lines on a phone</h1>
      <div id="follower" data-hero-reveal>Hero follower</div>
      <section id="block">
        <h2 id="heading" data-night-text="Night heading">Day heading</h2>
        <p id="kept" data-night-text="">Day paragraph with an empty night value</p>
        <p id="missing">Day paragraph with no night attribute</p>
        <img id="photo" alt="" src="./day-night-day.svg" srcset="./day-night-day.svg 1x, ./day-night-day-2x.svg 2x" sizes="400px"
          data-night-src="./day-night-night.svg" data-night-srcset="./day-night-night.svg 1x, ./day-night-night-2x.svg 2x" />
        <img id="photo-empty" alt="" src="./day-night-day.svg" data-night-src="" />
        <div id="frame" data-video-frame data-night-video="./day-night-night.mp4"></div>
        <a id="link" class="button" href="/day-link" data-night-href="/night-link" data-night-text="Night button">Day button</a>
      </section>
      <section id="masked" data-fixture-mask>
        <h2 id="masked-heading" data-night-text="Night masked heading that also wraps onto a second and a third line">Day masked heading that also wraps onto a second and a third line</h2>
        <p id="masked-text">Plain masked paragraph</p>
      </section>
      <p><a id="other" href="./day-night-b.html">Other page</a></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script src="./day-night.js"></script>
  </body>
</html>
