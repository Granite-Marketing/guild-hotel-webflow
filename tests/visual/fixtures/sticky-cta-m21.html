<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture: sticky CTA M21 M22</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <style>
      body { margin: 0; font-family: sans-serif; }
      /* Hero taller than the screen, like the phone hero (min-height 800px), with the button at its foot. */
      .section_hero { position: relative; overflow: hidden; height: 100vh; background: #29310c; color: #f4efdf; }
      .hero_component { position: relative; z-index: 2; height: 100%; }
      .hero_footer { position: absolute; bottom: 6rem; left: 0; right: 0; text-align: center; }
      .button { display: inline-block; padding: 0.75rem 1.5rem; background: #7a1f2b; color: #fff; }
      .section_groups { position: relative; height: 150vh; background: #e6dcc3; }
      .section_groups img { position: absolute; inset: 0; z-index: 5; width: 100%; height: 100%; background: #c9b98f; }
      .section_card-carousel-header-left { height: 100vh; background: #f4efdf; }
      .section_footer-links { height: 60vh; background: #111; }
    </style>
  </head>
  <body>
    <main>
      <section class="section_hero">
        <div class="hero_component">
          <div class="hero_footer"><a class="button" href="#reserve" data-reserve>Reserve a table</a></div>
        </div>
      </section>
      <section class="section_groups"><div style="height:100%"></div></section>
      <section class="section_card-carousel-header-left">Other dining options</section>
      <section class="section_footer-links">Footer</section>
    </main>
    <script src="./sticky-cta-m21.js"></script>
  </body>
</html>
